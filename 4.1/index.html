<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account Form</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>
<div class="form-container">
<div class="input-group">
<div class="input-icon"><i class="fa-solid fa-user"></i></div>
<input type="text" placeholder="Name">
</div>
<div class="input-group">
<div class="input-icon"><i class="fa-solid fa-phone"></i></div>
<input type="text" placeholder="(09) 123-4567">
</div>
<div class="input-group">
<div class="input-icon"><i class="fa-solid fa-envelope"></i></div>
<input type="email" placeholder="name@example.com">
</div>
<div class="input-group">
<div class="input-icon"><i class="fa-solid fa-lock"></i></div>
<input type="password" placeholder="Password">
</div>
<div class="terms">
<input type="checkbox" id="agree">
<label for="agree">I agree to the <a href="#">Terms and Conditions</a> and <a
href="#">Privacy Policy</a></label>
</div>
<div class="button-row">
<button class="create-btn">Create Account</button>
</div>
</div>
</body>
</html>
